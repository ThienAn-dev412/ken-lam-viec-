<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ ghi việc</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#1d2330;--muted:#7a8296;--line:#e5e8ee;--accent:#2f6feb;--accent-t:#fff;--ok:#1a8a4a;--danger:#c93b3b;--soft:#eaf1fe;--has:#dbe8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--text:#eceff4;--muted:#99a1b2;--line:#2c3340;--accent:#5b8dff;--accent-t:#0d1220;--ok:#4cc27d;--danger:#ff7a7a;--soft:#222c42;--has:#27375c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--text:#eceff4;--muted:#99a1b2;--line:#2c3340;--accent:#5b8dff;--accent-t:#0d1220;--ok:#4cc27d;--danger:#ff7a7a;--soft:#222c42;--has:#27375c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-t);font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
input{width:100%;padding:9px 11px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head .t{font-size:18px;font-weight:700;text-align:center;flex:1}
.head button{width:40px;padding:8px 0;font-size:18px}
.sum{margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.money{font-size:30px;font-weight:800;color:var(--accent);line-height:1.1}
.meta{font-size:13px;color:var(--muted)}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--danger);font-weight:700;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--soft);border-color:transparent}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin:12px 0 4px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.cell{aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text);padding:3px 0;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:15px}
.cell.blank{visibility:hidden}
.cell .b{font-size:12px;font-weight:700;min-height:16px;color:var(--accent)}
.cell.has{background:var(--has)}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--accent);color:var(--accent-t)}
.cell.sel .b{color:var(--accent-t)}
.day h2{font-size:16px;margin:0}
.day .s{font-size:13px;color:var(--muted);margin:2px 0 12px}
.quick{display:flex;gap:8px}
.quick button{flex:1;padding:12px 8px;font-size:16px}
.add{display:flex;gap:8px;margin-top:10px}
.add input.n{width:70px;flex:none;text-align:center}
.ents{margin-top:12px}
.ent{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ent .c{font-weight:700;min-width:28px}
.ent .nt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent button{background:transparent;color:var(--danger);padding:4px 8px;font-weight:500;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding-top:10px;border-top:1px solid var(--line)}
details{font-size:14px;color:var(--muted)}
summary{cursor:pointer;padding:4px 0}
.set{display:flex;gap:8px;align-items:center;margin-top:8px}
.set input{width:110px}
.warn{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@keyframes bump{40%{transform:scale(1.12)}}
.bump,.cell.pop{animation:bump .35s}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:40;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:transparent;color:inherit;padding:0;font-weight:700;text-decoration:underline}
.ent .step{display:flex;align-items:center;gap:4px}
.ent .step button{background:var(--soft);color:var(--text);width:30px;height:30px;padding:0;border-radius:8px;font-size:17px}
.ent .step .c{min-width:26px;text-align:center}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;background:transparent;color:var(--muted);padding:0;font-size:12px;font-weight:600}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--has);min-height:3px;transition:height .4s}
.bar.on i{background:var(--accent)}
.bar.on{color:var(--text)}
.bar .v{font-size:11px;min-height:14px}
.sumtxt{width:100%;min-height:150px;margin-top:10px;padding:9px;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;resize:vertical}
.sm{width:auto!important;padding:6px 12px!important;font-size:13px}
.ttl{font-size:15px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.app{font-size:20px;font-weight:800}
#menuBtn{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
#menuClose{width:40px;padding:8px 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--bg);z-index:30;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 24px rgba(0,0,0,.3)}
#menu[hidden],#scrim[hidden]{display:none}.hrow{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow .w{color:var(--muted);font-size:12px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;margin-right:6px;background:var(--soft);color:var(--accent)}
.tag.ok{color:var(--ok)}.tag.dl{color:var(--danger)}
#myName{margin:10px 0}
@media (hover:hover){.cell:hover:not(.sel){background:var(--soft)}.bar:hover i{filter:brightness(.92)}button:not(.cell):not(.bar):hover{filter:brightness(.95)}}
@media (max-width:360px){main{padding:8px}.money{font-size:26px}.cell{font-size:14px}.dow,.grid{gap:2px}}
@media (min-width:860px){
  body{font-size:17px}
  main{max-width:1040px;display:grid;grid-template-columns:1.2fr 1fr;column-gap:16px;align-items:start;padding:28px 20px}
  main>.card,main>details{grid-column:2;margin-bottom:14px}
  .top{grid-column:1/-1;grid-row:1}
  #warn{grid-column:1/-1;grid-row:4}
  main>section.card:nth-of-type(1){grid-column:1;grid-row:2/span 2;position:sticky;top:16px}
  .card{padding:18px}
  .money{font-size:36px}
  .cell{aspect-ratio:1/.85;font-size:16px}
  .head .t{font-size:20px}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <b class="app">Sổ ghi việc</b>
    <button class="ghost" id="menuBtn" aria-label="Mở menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <div id="scrim" hidden></div>
  <div id="warn" class="warn" hidden></div>

  <section class="card">
    <div class="head">
      <button class="ghost" id="prev" aria-label="Tháng trước">‹</button>
      <div class="t" id="title"></div>
      <button class="ghost" id="next" aria-label="Tháng sau">›</button>
    </div>
    <div class="sum">
      <div>
        <div class="money" id="sMoney">0đ</div>
        <div class="meta" id="sMeta">0 việc · 0 ngày</div>
      </div>
      <button class="chip" id="paidBtn">Chưa trả</button>
    </div>
    <div class="dow"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card day">
    <div class="head"><h2 id="dTitle"></h2><button class="ghost sm" id="goToday">Hôm nay</button></div>
    <div class="s" id="dSub"></div>
    <div class="quick">
      <button id="q1">+1 việc</button>
    </div>
    <div class="add">
      <input class="n" id="c" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Số việc">
      <input id="t" type="text" placeholder="Ghi chú (không bắt buộc)" aria-label="Ghi chú">
      <button id="add">Thêm</button>
    </div>
    <div class="ents" id="ents"></div>
  </section>

  <section class="card">
    <div class="ttl">6 tháng gần đây <span class="meta" style="font-weight:400">(bấm cột để xem tháng)</span></div>
    <div class="chart" id="chart"></div>
  </section>

  <aside id="menu" hidden>
  <div class="head" style="margin-bottom:12px"><b class="ttl" style="font-size:18px">Menu</b><button class="ghost" id="menuClose" aria-label="Đóng menu">✕</button></div>
  <section class="card">
    <div class="head"><span class="ttl">Bảng tổng kết tháng</span><button class="ghost sm" id="sumBtn">Xem</button></div>
    <div id="sumBox" hidden>
      <textarea class="sumtxt" id="sumTxt" readonly></textarea>
      <div style="margin-top:8px"><button id="copyBtn">Sao chép</button></div>
    </div>
  </section>

  <section class="card">
    <div class="head"><span class="ttl">Lịch sử chỉnh sửa</span><button class="ghost sm" id="histBtn">Xem</button></div>
    <div id="histBox" hidden>
      <input id="myName" type="text" placeholder="Tên của bạn (hiện trong lịch sử)" aria-label="Tên của bạn">
      <div id="histList"></div>
    </div>
  </section>

  <details class="card">
    <summary>Đơn giá</summary>
    <div class="set"><input id="p" type="number" min="0" step="100" inputmode="numeric" aria-label="Tiền mỗi việc"><span>đ / việc</span></div>
  </details>
  </aside>
</main>

<div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastUndo">Hoàn tác</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ CẤU HÌNH: dán firebaseConfig vào đây ============ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCLl9VVBt_CWnJB1RdRCy5RAgmAcA8TQ7I",
  authDomain: "ken-lam-viec.firebaseapp.com",
  projectId: "ken-lam-viec",
  storageBucket: "ken-lam-viec.firebasestorage.app",
  messagingSenderId: "116998464879",
  appId: "1:116998464879:web:eb3dce6d8254c8014cf49a"
};
var SO_ID = "9003957ad79775eb"; /* mã riêng của sổ, phải trùng với trong Rules */
/* ============================================================== */
(function(){
  if(!window.firebase || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('DÁN')===0) return;
  firebase.initializeApp(FIREBASE_CONFIG);
  var fs = firebase.firestore(), base = 'books/' + SO_ID + '/';
  function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); }catch(e){} return ''; }

  var myUid = ls('so-viec-uid');
  if(!myUid){ myUid = 'u' + Math.random().toString(36).slice(2,10); ls('so-viec-uid', myUid); }

  var ready = new Promise(function(resolve){
    var nm = ls('so-viec-name');
    if(nm){ window.__who = nm; resolve(); return; }
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(20,23,29,.92);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif';
    ov.innerHTML = '<div style="background:#fff;color:#1d2330;border-radius:16px;padding:24px;width:100%;max-width:340px;text-align:center">'
      + '<h2 style="margin:0 0 6px">Sổ ghi việc</h2>'
      + '<p style="color:#555;font-size:14px;margin:0 0 14px">Bạn tên gì? Tên này hiện trong lịch sử chỉnh sửa.</p>'
      + '<input id="nmIn" type="text" maxlength="30" placeholder="Nhập tên của bạn" style="width:100%;font:inherit;padding:10px 12px;border:1px solid #ccd;border-radius:10px;margin-bottom:12px;box-sizing:border-box">'
      + '<button id="nmBtn" style="font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:#2f6feb;color:#fff;cursor:pointer">Vào sổ</button></div>';
    document.body.appendChild(ov);
    function go(){
      var v = document.getElementById('nmIn').value.trim(); if(!v) return;
      ls('so-viec-name', v); window.__who = v;
      var mi = document.getElementById('myName'); if(mi) mi.value = v;
      ov.remove(); resolve();
    }
    document.getElementById('nmBtn').onclick = go;
    document.getElementById('nmIn').onkeydown = function(e){ if(e.key==='Enter') go(); };
  });

  function snapDoc(s){ return {id:s.id, exists:s.exists, data:function(){ return s.data(); }}; }
  function wrapDoc(r){ return {
    id: r.id,
    set: function(d){ return r.set(d); },
    delete: function(){ return r.delete(); },
    onSnapshot: function(n,e){ return r.onSnapshot(function(s){ n(snapDoc(s)); }, e); }
  }; }
  function wrapQuery(q){ return {
    orderBy: function(f,d){ return wrapQuery(q.orderBy(f,d)); },
    limit: function(n){ return wrapQuery(q.limit(n)); },
    onSnapshot: function(n,e){ return q.onSnapshot(function(s){ n({docs:s.docs.map(snapDoc), size:s.size, empty:s.empty}); }, e); }
  }; }
  function wrapCol(c){
    var w = wrapQuery(c);
    w.doc = function(id){ return wrapDoc(id ? c.doc(id) : c.doc()); };
    w.add = function(d){ return c.add(d).then(wrapDoc); };
    return w;
  }
  var dbApi = {
    collection: function(p){ return wrapCol(fs.collection(base + p)); },
    doc: function(p){ return wrapDoc(fs.doc(base + p)); }
  };
  var userApi = {
    id: async function(){ return myUid; },
    profiles: async function(ids){
      var out = {};
      [].concat(ids).forEach(function(id){ out[id] = {id:id, name:'', isMe:id===myUid, guest:false}; });
      return out;
    }
  };
  window.claude = { use: async function(name){
    if(name==='db'){ await ready; return dbApi; }
    if(name==='user'){ await ready; return userApi; }
    return null;
  } };
})();
</script>

<script>
(function(){
  var DEF_PRICE = 1000;
  var entries = [], price = DEF_PRICE, payments = {};
  var db = null, local = false, user = null, myId = null, hist = [];
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var fmt = function(n){ return Number(n).toLocaleString('vi-VN') + 'đ'; };
  var iso = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var todayStr = iso(new Date());
  var month = todayStr.slice(0,7);
  var sel = todayStr, popDate = null, tt;
  var DAYS = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];

  /* ---------- Lưu trữ ---------- */
  var LS = 'so-viec-v1';
  function lsLoad(){ try{ var o=JSON.parse(localStorage.getItem(LS)||'{}'); entries=o.entries||[]; price=o.price||DEF_PRICE; payments=o.payments||{}; hist=o.hist||[]; }catch(e){} }
  function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({entries:entries,price:price,payments:payments,hist:hist})); }catch(e){} }
  function warn(m){ var w=$('warn'); w.textContent=m; w.hidden=false; }

  async function init(){
    try{ if(window.claude){ db = await claude.use('db'); user = await claude.use('user'); if(user) myId = await user.id(); } }catch(e){ if(!db) db=null; }
    if(!db){ local=true; lsLoad(); warn('Đang lưu trên máy này: người khác sẽ không thấy dữ liệu.'); render(); return; }
    var err = function(){ warn('Không đọc được dữ liệu chung. Hãy tải lại trang.'); };
    db.collection('entries').onSnapshot(function(s){
      entries = s.docs.map(function(x){ var v=x.data(); return {id:x.id,date:v.date,count:v.count,note:v.note||'',createdAt:v.createdAt||0}; });
      render();
    }, err);
    db.doc('config/price').onSnapshot(function(s){
      var v=s.exists?s.data():null; price=(v&&typeof v.value==='number')?v.value:DEF_PRICE; render();
    }, err);
    db.collection('payments').onSnapshot(function(s){
      payments={}; s.docs.forEach(function(x){ var v=x.data(); if(v&&v.paid) payments[x.id]=true; }); render();
    }, err);
    db.collection('history').orderBy('at','desc').limit(150).onSnapshot(function(s){
      hist = s.docs.map(function(x){ var v=x.data(); v.id=x.id; return v; }); drawHist();
    }, err);
    render();
  }

  /* ---------- Hiển thị ---------- */
  function render(){
    var p = month.split('-'), y=+p[0], m=+p[1]-1;
    $('title').textContent = 'Tháng '+(m+1)+' / '+y;

    var byDay = {}, total = 0;
    entries.forEach(function(e){
      if(e.date && e.date.slice(0,7)===month){ byDay[e.date]=(byDay[e.date]||0)+e.count; total+=e.count; }
    });
    var nDays = Object.keys(byDay).length;
    var mt = fmt(total*price), mel = $('sMoney');
    if(mel.textContent!==mt){ mel.classList.remove('bump'); void mel.offsetWidth; mel.classList.add('bump'); }
    mel.textContent = mt;
    $('sMeta').textContent = total+' việc · '+nDays+' ngày';
    var paid = !!payments[month];
    $('paidBtn').textContent = paid ? '✓ Đã trả' : 'Chưa trả';
    $('paidBtn').className = 'chip'+(paid?' ok':'');

    var first = new Date(y,m,1), off = (first.getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
    var h = '';
    for(var i=0;i<off;i++) h += '<div class="cell blank"></div>';
    for(var d=1; d<=dim; d++){
      var ds = month+'-'+pad(d), c = byDay[ds]||0;
      h += '<button class="cell'+(c?' has':'')+(ds===todayStr?' today':'')+(ds===sel?' sel':'')+'" data-d="'+ds+'">'+d+'<span class="b">'+(c||'')+'</span></button>';
    }
    $('grid').innerHTML = h;
    if(popDate){ var pc = $('grid').querySelector('[data-d="'+popDate+'"]'); if(pc) pc.classList.add('pop'); popDate = null; }

    var sd = sel.split('-'), dt = new Date(+sd[0],+sd[1]-1,+sd[2]);
    $('dTitle').textContent = DAYS[dt.getDay()]+', '+sd[2]+'/'+sd[1]+'/'+sd[0];
    $('goToday').hidden = (sel===todayStr);
    var list = entries.filter(function(e){ return e.date===sel; }).sort(function(a,b){ return b.createdAt-a.createdAt; });
    var dayTotal = list.reduce(function(s,e){ return s+e.count; },0);
    $('dSub').textContent = dayTotal ? dayTotal+' việc · '+fmt(dayTotal*price) : 'Chưa có việc nào';
    if(!list.length){ $('ents').innerHTML = '<div class="empty">Bấm “+1 việc” để ghi.</div>'; }
    else{
      $('ents').innerHTML = list.map(function(e){
        var n=document.createElement('span'); n.textContent=e.note;
        return '<div class="ent"><span class="nt">'+(n.innerHTML||'Việc')+'</span><span class="step"><button data-act="dec" data-id="'+e.id+'" aria-label="Giảm">−</button><b class="c">'+e.count+'</b><button data-act="inc" data-id="'+e.id+'" aria-label="Tăng">+</button></span><button data-act="del" data-id="'+e.id+'" aria-label="Xóa">Xóa</button></div>';
      }).join('');
    }
    if(document.activeElement!==$('p')) $('p').value = price;
    drawChart(); sumUpdate();
  }

  /* ---------- Thao tác ---------- */
  async function log(rec){
    rec.at = Date.now(); rec.by = (($('myName').value||'').trim() || window.__who || '').slice(0,40);
    rec.uid = local ? 'local' : (myId||'');
    try{
      if(local){ rec.id='h'+rec.at; hist.unshift(rec); hist = hist.slice(0,150); lsSave(); drawHist(); }
      else await db.collection('history').add(rec);
    }catch(e){}
  }
  async function removeEntry(id){
    if(local){ entries = entries.filter(function(e){ return e.id!==id; }); lsSave(); render(); }
    else await db.collection('entries').doc(id).delete();
  }
  async function putEntry(rec){
    if(local){ var i = entries.findIndex(function(e){ return e.id===rec.id; }); if(i<0) entries.push(rec); else entries[i]=rec; lsSave(); render(); }
    else await db.collection('entries').doc(rec.id).set({date:rec.date,count:rec.count,note:rec.note||'',createdAt:rec.createdAt});
  }
  async function addEntry(count, note){
    var rec = {id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:sel, count:count, note:note||'', createdAt:Date.now()};
    try{
      popDate = sel;
      await putEntry(rec);
      log({act:'add', date:rec.date, count:count, note:rec.note});
      toast('Đã thêm '+count+' việc', function(){ removeEntry(rec.id); log({act:'del', undo:true, date:rec.date, count:count, note:rec.note}); });
    }catch(e){ popDate = null; alert('Không lưu được. Có thể bạn chưa có quyền ghi vào trang này.'); }
  }
  $('q1').onclick = function(){ addEntry(1); };
  $('add').onclick = function(){
    var c = parseInt($('c').value,10);
    if(!c || c<1){ alert('Nhập số việc từ 1 trở lên.'); return; }
    addEntry(c, $('t').value.trim()); $('t').value=''; $('c').value=1;
  };

  $('grid').onclick = function(ev){
    var b = ev.target.closest('button.cell'); if(!b) return;
    sel = b.getAttribute('data-d'); render();
  };

  $('ents').onclick = async function(ev){
    var b = ev.target.closest('button[data-id]'); if(!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
    var e = entries.find(function(x){ return x.id===id; }); if(!e) return;
    try{
      if(act==='inc' || (act==='dec' && e.count>1)){
        var nc = e.count+(act==='inc'?1:-1);
        await putEntry({id:id,date:e.date,count:nc,note:e.note,createdAt:e.createdAt});
        log({act:'edit', date:e.date, from:e.count, to:nc, note:e.note});
      } else {
        var old = {id:id,date:e.date,count:e.count,note:e.note,createdAt:e.createdAt};
        await removeEntry(id);
        log({act:'del', date:old.date, count:old.count, note:old.note});
        toast('Đã xóa dòng', function(){ putEntry(old); log({act:'restore', date:old.date, count:old.count, note:old.note}); });
      }
    }catch(x){ alert('Không cập nhật được.'); }
  };

  $('paidBtn').onclick = async function(){
    var now = !payments[month];
    try{
      if(local){ if(now) payments[month]=true; else delete payments[month]; lsSave(); render(); }
      else await db.doc('payments/'+month).set({paid:now});
      log({act:'paid', month:month, paid:now});
    }catch(e){ alert('Không cập nhật được.'); }
  };

  $('p').onchange = async function(){
    var v = parseInt($('p').value,10);
    if(isNaN(v)||v<0){ $('p').value=price; return; }
    var oldP = price;
    try{
      if(local){ price=v; lsSave(); render(); }
      else await db.doc('config/price').set({value:v});
      if(v!==oldP) log({act:'price', from:oldP, to:v});
    }catch(e){ alert('Không đổi được đơn giá.'); $('p').value=price; }
  };

  function shift(n){
    var p=month.split('-'), dt=new Date(+p[0],+p[1]-1+n,1);
    month = dt.getFullYear()+'-'+pad(dt.getMonth()+1);
    sel = (month===todayStr.slice(0,7)) ? todayStr : month+'-01';
    render();
  }
  $('prev').onclick = function(){ shift(-1); };
  $('next').onclick = function(){ shift(1); };

  function toast(msg, undo){
    $('toastTxt').textContent = msg;
    var u = $('toastUndo'); u.hidden = !undo;
    u.onclick = function(){ $('toast').hidden = true; if(undo) undo(); };
    $('toast').hidden = false; clearTimeout(tt);
    tt = setTimeout(function(){ $('toast').hidden = true; }, 5000);
  }

  function goMonth(k){ month = k; sel = (k===todayStr.slice(0,7)) ? todayStr : k+'-01'; render(); }
  $('goToday').onclick = function(){ goMonth(todayStr.slice(0,7)); };

  function drawChart(){
    var p = month.split('-'), ms = [], tot = {};
    for(var i=5;i>=0;i--){ var d = new Date(+p[0],+p[1]-1-i,1); ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1)); }
    entries.forEach(function(e){ var k = e.date && e.date.slice(0,7); if(k) tot[k] = (tot[k]||0)+e.count; });
    var mx = Math.max.apply(null, ms.map(function(k){ return tot[k]||0; }).concat([1]));
    $('chart').innerHTML = ms.map(function(k){
      var v = tot[k]||0;
      return '<button class="bar'+(k===month?' on':'')+'" data-m="'+k+'"><span class="v">'+(v||'')+'</span><i style="height:'+Math.round(v/mx*76)+'px"></i><span>T'+(+k.slice(5))+'</span></button>';
    }).join('');
  }
  $('chart').onclick = function(ev){ var b = ev.target.closest('button[data-m]'); if(b) goMonth(b.getAttribute('data-m')); };

  function sumText(){
    var p = month.split('-'), byDay = {}, total = 0;
    entries.forEach(function(e){ if(e.date && e.date.slice(0,7)===month){ byDay[e.date] = (byDay[e.date]||0)+e.count; total += e.count; } });
    var t = 'Tháng '+(+p[1])+'/'+p[0]+'\n';
    Object.keys(byDay).sort().forEach(function(d){ t += d.slice(8)+'/'+d.slice(5,7)+': '+byDay[d]+' việc\n'; });
    return t+'Tổng: '+total+' việc × '+fmt(price)+' = '+fmt(total*price)+(payments[month]?' (đã trả)':' (chưa trả)');
  }
  function sumUpdate(){ if(!$('sumBox').hidden) $('sumTxt').value = sumText(); }
  $('sumBtn').onclick = function(){ var b = $('sumBox'); b.hidden = !b.hidden; $('sumBtn').textContent = b.hidden ? 'Xem' : 'Ẩn'; sumUpdate(); };
  $('copyBtn').onclick = function(){
    var ta = $('sumTxt'), ok = false; ta.focus(); ta.select();
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){ toast('Đã sao chép'); }, function(){ toast('Hãy giữ chữ rồi chọn Sao chép'); }); return; }
    toast(ok ? 'Đã sao chép' : 'Hãy giữ chữ rồi chọn Sao chép');
  };

  var esc = function(s){ var d = document.createElement('span'); d.textContent = (s==null ? '' : String(s)); return d.innerHTML; };
  function hText(h){
    var d = h.date ? h.date.slice(8)+'/'+h.date.slice(5,7) : '';
    var n = h.note ? ' — “'+h.note+'”' : '';
    switch(h.act){
      case 'add': return {t:'Thêm', c:'ok', s:h.count+' việc ngày '+d+n};
      case 'edit': return {t:'Sửa', c:'', s:'số việc ngày '+d+': '+h.from+' → '+h.to+n};
      case 'del': return {t:'Xóa', c:'dl', s:h.count+' việc ngày '+d+n+(h.undo?' (hoàn tác lần thêm)':'')};
      case 'restore': return {t:'Khôi phục', c:'ok', s:h.count+' việc ngày '+d+n};
      case 'price': return {t:'Đổi đơn giá', c:'', s:fmt(h.from)+' → '+fmt(h.to)};
      case 'paid': return {t:h.paid?'Đã trả':'Bỏ đã trả', c:h.paid?'ok':'dl', s:'tháng '+h.month.slice(5)+'/'+h.month.slice(0,4)};
    }
    return {t:'Khác', c:'', s:''};
  }
  async function drawHist(){
    if($('histBox').hidden) return;
    var ids = [], seen = {};
    hist.forEach(function(h){ if(h.uid && h.uid!=='local' && !seen[h.uid]){ seen[h.uid]=1; ids.push(h.uid); } });
    var ps = {};
    try{ if(user && ids.length) ps = await user.profiles(ids); }catch(e){}
    if(!hist.length){ $('histList').innerHTML = '<div class="empty">Chưa có thay đổi nào được ghi lại.</div>'; return; }
    $('histList').innerHTML = hist.map(function(h){
      var p = ps[h.uid], who = (p && p.name) || h.by || (h.uid==='local' ? 'Máy này' : 'Một người dùng');
      if(p && p.isMe) who += ' (bạn)';
      var dt = new Date(h.at), tx = hText(h);
      var when = pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+' '+pad(dt.getHours())+':'+pad(dt.getMinutes());
      return '<div class="hrow"><div class="w">'+when+' · '+esc(who)+'</div><b class="tag '+tx.c+'">'+esc(tx.t)+'</b>'+esc(tx.s)+'</div>';
    }).join('');
  }
  $('histBtn').onclick = function(){ var b = $('histBox'); b.hidden = !b.hidden; $('histBtn').textContent = b.hidden ? 'Xem' : 'Ẩn'; drawHist(); };
  try{ $('myName').value = localStorage.getItem('so-viec-name') || ''; }catch(e){}
  $('myName').onchange = function(){ try{ localStorage.setItem('so-viec-name', $('myName').value.trim()); }catch(e){} };

  function menu(open){
    $('menu').hidden = !open; $('scrim').hidden = !open;
    $('menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) drawHist();
  }
  $('menuBtn').onclick = function(){ menu($('menu').hidden); };
  $('menuClose').onclick = function(){ menu(false); };
  $('scrim').onclick = function(){ menu(false); };
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') menu(false); });

  $('t').onkeydown = function(e){ if(e.key==='Enter') $('add').click(); };
  var sx = null;
  $('grid').addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  $('grid').addEventListener('touchend', function(e){
    if(sx===null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if(Math.abs(dx)>60) shift(dx<0 ? 1 : -1);
  });

  document.addEventListener('keydown', function(e){
    var tg = (e.target.tagName||'').toLowerCase();
    if(tg==='input' || tg==='textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key==='ArrowLeft') shift(-1);
    else if(e.key==='ArrowRight') shift(1);
  });

  init();
})();
</script>
</body>
</html>
